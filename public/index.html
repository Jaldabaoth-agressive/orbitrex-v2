</style></head><body>
<aside id="nav"></aside><div id="mn"><header id="top"></header><div id="bn"></div><main id="main"></main></div><div id="att"></div>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),clone=o=>JSON.parse(JSON.stringify(o)),iso=()=>new Date().toISOString(),fmt=(v,d=2)=>v==null||isNaN(v)?'—':(+v).toFixed(d);

// Detect environment: on GitHub Pages or file:// without local backend, default to simulation so dashboard is immediately live!
const isGitHubOrStatic = location.protocol === 'file:' || location.hostname.includes('github.io');
const autoWs = (location.protocol === 'https:' ? 'wss://' : 'ws://') + (location.host || 'localhost:3000');

const VER='1.0.0',DEF={
  mission:'ORBITREX Mission',
  desc:'ESP32-based CubeSat prototype',
  sat:'ORBITREX-01',
  start:'',
  interval:1000,
  timeout:10,
  range:300,
  retention:5000,
  theme:'dark',
  mode: isGitHubOrStatic ? 'sim' : 'hardware',
  ws: autoWs,
  th:{tw:35,tc:40,bw:3.5,bc:3.3,sw:-85},
  hyst:{temperature_c:1,battery_voltage_v:.05,signal_strength_dbm:2},
  sensors:{temperature:true,humidity:true,imu_a:true,imu_g:true,battery:true,signal:true}
};

const P=[
  ['temperature_c','Temperature','°C','temperature',-60,150],
  ['battery_voltage_v','Battery voltage','V','battery',0,6],
  ['humidity_percent','Humidity','%','humidity',0,100],
  ['signal_strength_dbm','Signal strength','dBm','signal',-140,0],
  ...['x','y','z'].map(a=>['acceleration_'+a,'Accel '+a.toUpperCase(),'m/s²','imu_a',-160,160]),
  ...['x','y','z'].map(a=>['gyroscope_'+a,'Gyro '+a.toUpperCase(),'°/s','imu_g',-2000,2000])
].map(([k,n,u,s,lo,hi])=>({k,n,u,s,lo,hi})),PM=Object.fromEntries(P.map(p=>[p.k,p]));

const SN={temperature:'Temperature sensor',humidity:'Humidity sensor (optional)',imu_a:'MPU6500 accelerometer',imu_g:'MPU6500 gyroscope',battery:'Battery voltage monitor',signal:'Signal strength (RSSI) telemetry'};

let cfgOk=true;
function load(){
  try{
    const s=JSON.parse(localStorage.getItem('orbitrex.cfg')||'{}');
    if(s && Object.keys(s).length>0){
      if(!s.ws) s.ws = autoWs;
      return{...clone(DEF),...s,th:{...DEF.th,...s.th},hyst:{...DEF.hyst,...s.hyst},sensors:{...DEF.sensors,...s.sensors}};
    }
  }catch{}
  return clone(DEF);
}
function persist(){try{localStorage.setItem('orbitrex.cfg',JSON.stringify(cfg));cfgOk=true}catch{cfgOk=false}}

let cfg=load(),draft=clone(cfg),view='dash',buf=[],last=null,lastRecv=0,count=0,rej=[],rejN=0,gaps=0,al=[],cur={},aid=0,evs=[],db,sok=true,serr='',saved=0,hist=[],hl=0,EX=null,SE=[],SM='',CF='',HS=null;
let hw={s:isGitHubOrStatic?'UNCONFIGURED':'CONNECTING',e:'',n:0},ws=null,hwt=null;

const F={sel:['temperature_c','battery_voltage_v'],lc:P.map(p=>p.k),rng:String(cfg.range),sd:'',st:'',ss:'',as:'',at:'',ap:'',am:'0',hq:'',hs:'',h1:'',h2:'',hf:'',ht:'',hp:'',ha:'0',ho:'td',hpg:0,hc:'temperature_c',sc:'normal'};
const srcName=()=>cfg.mode==='hardware'?'HARDWARE':'SIMULATION',CL={NOMINAL:'ok',AVAILABLE:'ok',CONNECTED:'ok',IMPLEMENTED:'ok',INFO:'bl',SIMULATION:'bl','SIMULATOR RUNNING':'bl',WARNING:'wa',STALE:'wa',UNVERIFIED:'wa',ACKNOWLEDGED:'wa','SIMULATOR PAUSED':'wa',CONNECTING:'wa',CRITICAL:'cr',FAULT:'cr',OFFLINE:'cr',DISCONNECTED:'cr',ACTIVE:'cr'},chip=s=>`<span class="ch ${CL[s]||''}">${esc(s)}</span>`;
const ev=(sev,msg,src)=>{evs.unshift({t:iso(),sev,msg,src:src||srcName()});evs.length=Math.min(evs.length,200)};

/* ---- validation ---- */
function validate(p){
  const e=[];
  if(!p||typeof p!=='object'||Array.isArray(p))return['packet is not an object'];
  if(typeof p.satellite_id!=='string'||!p.satellite_id)e.push('satellite_id missing');
  else if(p.satellite_id!==cfg.sat)e.push('satellite_id mismatch ('+p.satellite_id+')');
  if(!Number.isInteger(p.sequence_number)||p.sequence_number<0)e.push('invalid sequence_number');
  if(typeof p.timestamp!=='string'||!/^\d{4}-\d\d-\d\dT[\d:.]+Z$/.test(p.timestamp)||isNaN(Date.parse(p.timestamp)))e.push('timestamp must be ISO-8601 UTC (…Z)');
  if(typeof p.status!=='string')e.push('status missing');
  for(const q of P){
    const v=p[q.k];
    if(v==null)continue;
    if(typeof v!=='number'||!isFinite(v))e.push(q.k+' not a finite number');
    else if(v<q.lo||v>q.hi)e.push(q.k+' out of range '+q.lo+'…'+q.hi);
  }
  return e;
}

function bad(why,raw,src){
  rejN++;
  rej.unshift({t:iso(),why,src,raw:String(typeof raw==='string'?raw:JSON.stringify(raw)).slice(0,160)});
  rej.length=Math.min(rej.length,20);
  ev('WARNING','Packet rejected: '+why,src);
}

function ingest(raw,src){
  let p=raw;
  if(typeof raw==='string'){
    try{p=JSON.parse(raw)}catch{return bad('invalid JSON',raw,src)}
  }

  // Normalizer: allow incoming ESP32 SensorPacket field names directly
  if(p && !p.temperature_c && (p.temperature!=null||p.bmpTemperature!=null)) p.temperature_c = p.temperature ?? p.bmpTemperature;
  if(p && !p.battery_voltage_v && p.battery_v!=null) p.battery_voltage_v = p.battery_v;
  if(p && !p.humidity_percent && p.humidity!=null) p.humidity_percent = p.humidity;
  if(p && !p.signal_strength_dbm && p.rssi!=null) p.signal_strength_dbm = p.rssi;
  if(p && !p.acceleration_x && p.ax!=null){ p.acceleration_x=p.ax; p.acceleration_y=p.ay; p.acceleration_z=p.az; }
  if(p && !p.gyroscope_x && p.gx!=null){ p.gyroscope_x=p.gx; p.gyroscope_y=p.gy; p.gyroscope_z=p.gz; }
  if(p && !p.sequence_number && p.packetNo!=null) p.sequence_number = p.packetNo;
  if(p && !p.satellite_id) p.satellite_id = cfg.sat || 'ORBITREX-01';
  if(p && !p.timestamp) p.timestamp = iso();
  if(p && !p.status) p.status = 'OK';

  const er=validate(p);
  if(er.length)return bad(er.join('; '),p,src);
  const r={...p,source:src,received_at:iso()};

  if(last){
    const d=p.sequence_number-last.sequence_number;
    if(d>1){gaps++;ev('WARNING','Sequence gap: '+(last.sequence_number+1)+'…'+(p.sequence_number-1)+' missing',src)}
    else if(d<=0)ev('INFO','Sequence reset/duplicate: '+p.sequence_number+' after '+last.sequence_number,src);
  }

  buf.push(r);
  if(buf.length>1000)buf.shift();
  last=r;
  lastRecv=Date.now();
  count++;
  save(r);
  evalAlerts(r);
  attIn(r);
}

/* ---- storage ---- */
const openDB=()=>new Promise(res=>{
  try{
    const q=indexedDB.open('orbitrex',1);
    q.onupgradeneeded=()=>q.result.createObjectStore('packets',{autoIncrement:true});
    q.onsuccess=()=>{db=q.result;res()};
    q.onerror=()=>{sok=false;serr=String(q.error);res()};
  }catch(e){
    sok=false;serr=String(e);res();
  }
});

function save(r){
  if(!db)return;
  try{
    const t=db.transaction('packets','readwrite');
    t.objectStore('packets').add(r);
    t.oncomplete=()=>{saved++;if(saved%200===0)prune()};
    t.onerror=t.onabort=()=>{sok=false;serr=String(t.error)};
  }catch(e){sok=false;serr=String(e)}
}

function prune(){
  if(!db)return;
  const s=db.transaction('packets','readwrite').objectStore('packets');
  s.count().onsuccess=e=>{
    let n=e.target.result-cfg.retention;
    if(n<=0)return;
    s.openCursor().onsuccess=c=>{const k=c.target.result;if(k&&n-->0){k.delete();k.continue()}};
  };
}

const allRecs=()=>new Promise(r=>{
  if(!db)return r([]);
  try{
    const q=db.transaction('packets').objectStore('packets').getAll();
    q.onsuccess=()=>r(q.result);
    q.onerror=()=>r([]);
  }catch{r([])}
});

/* ---- alerts ---- */
const thr=k=>{const T=cfg.th;return{temperature_c:[T.tw,T.tc,1],battery_voltage_v:[T.bw,T.bc,0],signal_strength_dbm:[T.sw,null,0]}[k]};
const lvl=(v,w,c,hi,h,cs)=>{const s=hi?1:-1,ov=t=>t!=null&&s*(v-t)>0,clr=t=>t==null||s*(v-t)<=-h;let L=ov(c)?2:ov(w)?1:0;if(cs==2&&L<2&&!clr(c))L=2;if(cs>=1&&L<1&&!clr(w))L=1;return L};

function raise(key,sev,param,val,th,msg,src,L){
  const c=cur[key];
  if(c&&c.sev===sev)return;
  if(c){c.st='resolved';c.rt=iso()}
  const a={id:++aid,t:iso(),sev,key,param,val,th,msg,src,st:'active',lv:L};
  al.unshift(a);
  cur[key]=a;
  ev(sev,msg,src);
}

function clearA(key){
  const c=cur[key];
  if(c){c.st='resolved';c.rt=iso();delete cur[key];ev('INFO','Recovered: '+c.param,c.src)}
}

function evalAlerts(r){
  for(const p of P){
    const t=thr(p.k);
    if(!t||!cfg.sensors[p.s])continue;
    const v=r[p.k];
    if(v==null)continue;
    const L=lvl(v,t[0],t[1],t[2],cfg.hyst[p.k]||0,cur[p.k]?cur[p.k].lv:0);
    if(!L){clearA(p.k);continue}
    const th=L==2?t[1]:t[0];
    raise(p.k,L==2?'CRITICAL':'WARNING',p.n,v,th,`${p.n} ${v} ${p.u} is ${t[2]?'above':'below'} ${th} ${p.u} (example threshold)`,r.source,L);
  }
}
const sevOf=r=>Math.max(0,...P.map(p=>{const t=thr(p.k);return t&&r[p.k]!=null&&cfg.sensors[p.s]?lvl(r[p.k],t[0],t[1],t[2],0,0):0}));

/* ---- sensor status ---- */
const lastOf=k=>{for(let i=buf.length-1;i>=0;i--)if(buf[i][k]!=null)return buf[i];return null};
const faults=r=>{const m=(r.status||'').match(/FAULT:([\w,]+)/i);return m?m[1].toLowerCase().split(','):[]};
function sst(id){
  if(!cfg.sensors[id])return'NOT CONFIGURED';
  if(last&&faults(last).includes(id))return'FAULT';
  const rs=P.filter(p=>p.s===id).map(p=>lastOf(p.k)).filter(Boolean);
  if(!rs.length)return'NO DATA';
  return Date.now()-Math.max(...rs.map(r=>Date.parse(r.received_at)))>cfg.timeout*1000?'STALE':'AVAILABLE';
}
const health=()=>{
  if(cfg.mode==='hardware'&&!/^wss?:/.test(cfg.ws))return'NOT CONFIGURED';
  if(!last)return'NO DATA';
  if(Date.now()-lastRecv>cfg.timeout*1000)return'OFFLINE';
  const a=Object.values(cur);
  return a.some(x=>x.sev==='CRITICAL')?'CRITICAL':a.length?'WARNING':'NOMINAL';
};
const conn=()=>cfg.mode==='hardware'?hw.s:sim.on?'SIMULATOR RUNNING':sim.started?'SIMULATOR PAUSED':'SIMULATOR STOPPED';
const age=()=>lastRecv?((Date.now()-lastRecv)/1000).toFixed(0)+' s ago':'no data';

/* ---- simulator ---- */
const sim={on:false,started:false,timer:null,seq:0,seed:42,x:null},X0=()=>({t:24,b:4.1,h:45,s:-70,ax:0,ay:0,gx:0,gy:0,gz:0});
sim.x=X0();
const rng=()=>{let t=(sim.seed+=0x6D2B79F5);t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};

function simStep(){
  const x=sim.x,r=()=>rng()-.5,sc=F.sc;
  sim.seq++;
  if(sc==='gap'&&sim.seq%10===0)sim.seq+=3;
  x.t+=((sc==='overheat'?44:24)-x.t)*.06+r()*.3;
  x.b+=((sc==='lowbatt'?3:4.1)-x.b)*(sc==='lowbatt'?.02:.002)+r()*.004;
  x.h+=(45-x.h)*.02+r();
  x.s+=((sc==='weak'?-95:-70)-x.s)*.1+r()*2;
  ['ax','ay','gx','gy','gz'].forEach(k=>x[k]+=r()*(k[0]==='a'?.4:8)-x[k]*.15);
  if(sc==='spin'){x.gz=30+r()*2;x.gx=15+r()*2}
  const v={
    temperature_c:x.t,battery_voltage_v:x.b,humidity_percent:sc==='fault'?null:x.h,
    signal_strength_dbm:x.s,acceleration_x:x.ax,acceleration_y:x.ay,acceleration_z:9.81+x.ax*.1,
    gyroscope_x:x.gx,gyroscope_y:x.gy,gyroscope_z:x.gz
  };
  const p={satellite_id:cfg.sat,sequence_number:sim.seq,timestamp:iso()};
  for(const q of P)if(cfg.sensors[q.s])p[q.k]=v[q.k]==null?null:+v[q.k].toFixed(q.k==='battery_voltage_v'?3:2);
  nw_simExtra(p);
  p.status=sc==='fault'?'FAULT:humidity':'OK';
  if(sc==='bad'&&sim.seq%5===0)p.temperature_c='NaN';
  ingest(p,'SIMULATION');
}
const simGo=()=>{clearInterval(sim.timer);sim.on=sim.started=true;sim.timer=setInterval(simStep,cfg.interval)};

/* ---- hardware adapter (WebSocket to Node.js server) ---- */
function hwStop(){clearTimeout(hwt);if(ws){ws.onclose=ws.onerror=ws.onmessage=null;try{ws.close()}catch{}}ws=null}
function hwStart(){
  hwStop();
  if(cfg.mode!=='hardware')return;
  if(!/^wss?:\/\//.test(cfg.ws||'')){hw={s:'UNCONFIGURED',e:'No WebSocket URL configured',n:0};return}
  hw.s='CONNECTING';
  try{
    ws=new WebSocket(cfg.ws);
    ws.onopen=()=>{
      hw={s:'CONNECTED',e:'',n:0};
      ev('INFO','WebSocket open & streaming telemetry','HARDWARE');
      render();
    };
    ws.onmessage=e=>{
      try{
        const d=JSON.parse(e.data);
        if(d.type==='CONNECTION_ACK'){if(d.lastPacket)ingest(d.lastPacket,'HARDWARE');return;}
        if(d.type==='PONG'||d.type==='SIMULATION_STATUS')return;
        ingest(d,'HARDWARE');
      }catch{
        ingest(e.data,'HARDWARE');
      }
    };
    ws.onerror=()=>{hw.e='WebSocket error (backend unreachable or port connecting)'};
    ws.onclose=()=>{
      if(cfg.mode!=='hardware')return;
      hw.s='DISCONNECTED';
      hw.n++;
      hwt=setTimeout(hwStart,Math.min(10000,1000*2**Math.min(hw.n,5)));
    };
  }catch(e){
    hw.s='DISCONNECTED';
    hw.e=String(e);
  }
}

let curMode=null;
function clearLive(src){
  buf=[];last=null;lastRecv=0;count=0;rej=[];rejN=0;gaps=0;al=[];cur={};
  evs=evs.filter(e=>e.src!==src);
  Object.assign(AT,{q:[1,0,0,0],d:[1,0,0,0],t:null,w:null,src:'',bu:0});
  attTxt();
}

function applyCfg(){
  document.documentElement.dataset.theme=cfg.theme;
  clearInterval(sim.timer);
  hwStop();
  const old=curMode,sw=old!==null&&old!==cfg.mode;
  curMode=cfg.mode;
  if(sw){
    clearLive(old==='hardware'?'HARDWARE':'SIMULATION');
    F.hs=cfg.mode==='hardware'?'HARDWARE':'SIMULATION';
    F.hpg=0;
  }
  if(cfg.mode==='sim'){
    hw={s:'UNCONFIGURED',e:'',n:0};
    if(sim.on)sim.timer=setInterval(simStep,cfg.interval);
    if(sw||!sim.started)simGo();
  }else{
    sim.on=sim.started=false;
    sim.seq=0;
    sim.seed=42;
    sim.x=X0();
    hw={s:'CONNECTING',e:'',n:0};
    hwStart();
  }
  if(sw)ev('INFO','Data source switched to '+srcName()+' — previous live data cleared');
}

/* ---- charts ---- */
function chart(d,k,o={}){
  const w=o.w||560,h=o.h||150,m=o.s?2:36,mb=o.s?2:16,pts=d.filter(r=>r[k]!=null);
  if(!pts.length)return o.s?'<div class="mu">no trend</div>':'<div class="em">No data in range</div>';
  const T=r=>Date.parse(r.timestamp),t0=o.t0??T(d[0]),t1=Math.max(o.t1??T(d[d.length-1]),t0+1000),st=Math.ceil(d.length/300);
  let lo=Math.min(...pts.map(r=>r[k])),hi=Math.max(...pts.map(r=>r[k]));
  if(lo===hi){lo-=1;hi+=1}
  const pd=(hi-lo)*.1;
  lo-=pd;
  hi+=pd;
  const X=t=>m+(t-t0)/(t1-t0)*(w-m-4),Y=v=>h-mb-(v-lo)/(hi-lo)*(h-mb-4),u=PM[k]?PM[k].u:'';
  let path='',dots='',gap=1;
  d.forEach((r,i)=>{
    if(r[k]==null){gap=1;return}
    if(i%st&&!gap)return;
    const x=X(T(r)).toFixed(1),y=Y(r[k]).toFixed(1);
    path+=(gap?'M':'L')+x+' '+y;
    gap=0;
    if(!o.s)dots+=`<circle cx="${x}" cy="${y}" r="3" fill="var(--cy)" opacity=".6"><title>${r[k]} ${u} @ ${r.timestamp}</title></circle>`;
  });
  const grid=o.s?'':[0,1,2,3].map(i=>{
    const v=lo+(hi-lo)*i/3,y=Y(v);
    return`<line x1="${m}" x2="${w-4}" y1="${y}" y2="${y}" stroke="var(--bd)"/><text x="2" y="${y+3}">${v.toFixed(Math.abs(v)<10?2:1)}</text>`;
  }).join('')+`<text x="${m}" y="${h-3}">${new Date(t0).toISOString().slice(11,19)}Z</text><text x="${w-4}" y="${h-3}" text-anchor="end">${new Date(t1).toISOString().slice(11,19)}Z</text>`;
  return`<svg viewBox="0 0 ${w} ${h}" width="100%"${o.f?' height="100%" preserveAspectRatio="none"':''} role="img" aria-label="${(PM[k]&&PM[k].n)||k} trend">${grid}<path d="${path}" fill="none" stroke="var(--cy)" stroke-width="1.5"${o.f?' vector-effect="non-scaling-stroke"':''}/>${dots}</svg>`;
}

function met(){
  if(!cfg.start)return null;
  const d=Date.parse(cfg.start+':00Z');
  if(isNaN(d))return null;
  let s=Math.round((Date.now()-d)/1000);
  const g=s<0?'T−':'T+';
  s=Math.abs(s);
  return g+[s/3600|0,s/60%60|0,s%60].map(n=>String(n).padStart(2,'0')).join(':');
}

/* ---- roll / pitch / GPS / pressure / BMP-altitude windows ---- */
const nw_lf=k=>{for(let i=buf.length-1;i>=0;i--){const v=buf[i][k];if(typeof v==='number'&&isFinite(v))return buf[i]}return null};
const nw_nv=(k,d=1)=>{const r=nw_lf(k);return r?fmt(r[k],d):'—'};
const nw_ws=k=>{const r=nw_lf(k);return chip(!r?'NO DATA':Date.now()-Date.parse(r.received_at)>cfg.timeout*1000?'STALE':'AVAILABLE')};
const nw_wh=(n,k)=>`<div class="row" style="margin:0 0 2px"><b>${n}</b>${nw_ws(k)}</div>`;
const nw_bg=(v,u)=>`<div class="big">${v} <small>${u}</small></div>`;
const nw_spark=k=>{
  const d=buf.slice(-60);
  const v=d.map(r=>typeof r[k]==='number'&&isFinite(r[k])?r[k]:null);
  const f=v.filter(y=>y!=null);
  if(f.length<2)return'<div class="sp mu">no trend yet</div>';
  const lo=Math.min(...f),sz=Math.max(...f)-lo||1;
  let p='',gap=1;
  v.forEach((y,i)=>{
    if(y==null){gap=1;return}
    p+=(gap?'M':'L')+((i+60-d.length)/59*100).toFixed(1)+' '+(34-(y-lo)/sz*32).toFixed(1);
    gap=0;
  });
  return`<div class="sp"><svg viewBox="0 0 100 36" preserveAspectRatio="none"><path d="${p}" fill="none" stroke="var(--cy)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg></div>`;
};

const nw_dial=(k,f)=>{
  const r=nw_lf(k);
  return r?`<svg viewBox="-30 -30 60 60" width="64" height="64" style="flex:none" aria-hidden="true"><circle r="26" fill="none" stroke="var(--bd)"/><line x1="-24" x2="24" stroke="var(--bd)" stroke-dasharray="2 2"/><g transform="rotate(${f(r[k])})"><line x1="-24" x2="24" stroke="var(--cy)" stroke-width="2"/><circle cx="24" r="3" fill="var(--cy)"/></g></svg>`:'';
};

function nw_gpsBody(){
  const g=[...buf].reverse().find(r=>typeof r.gpsFix==='number');
  const h=nw_wh('GPS','gpsFix');
  if(!g)return h+'<div class="mu">No GPS data</div>';
  if(!g.gpsFix)return h+`<div class="row" style="margin:0"><span class="ch wa">NO FIX</span><span class="mu">${g.satellites??'—'} satellites · position not valid</span></div>`;
  const pts=buf.filter(r=>r.gpsFix>0&&typeof r.latitude==='number'&&typeof r.longitude==='number').slice(-300);
  if(!pts.length)return h+'<div class="mu">Fix reported but no coordinates in the packet</div>';
  const k=Math.cos(pts[0].latitude*Math.PI/180);
  const xs=pts.map(r=>(r.longitude-pts[0].longitude)*k);
  const ys=pts.map(r=>r.latitude-pts[0].latitude);
  const cx=(Math.min(...xs)+Math.max(...xs))/2;
  const cy=(Math.min(...ys)+Math.max(...ys))/2;
  const sz=Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys))||1;
  const X=v=>(50+(v-cx)/sz*80).toFixed(1);
  const Y=v=>(50-(v-cy)/sz*80).toFixed(1);
  return h+`<div class="row" style="margin:0"><span class="ch ok">FIX</span><span>${fmt(g.latitude,5)}°, ${fmt(g.longitude,5)}°</span></div><div class="mu">Alt ${fmt(g.altitude,1)} m · ${fmt(g.speed,1)} km/h · ${g.satellites??'—'} sats · fix ${g.gpsFix}</div><div class="sp"><svg viewBox="0 0 100 100"><polyline fill="none" stroke="var(--cy)" stroke-width="1.2" vector-effect="non-scaling-stroke" points="${pts.map((_,i)=>X(xs[i])+','+Y(ys[i])).join(' ')}"/><circle cx="${X(xs[xs.length-1])}" cy="${Y(ys[ys.length-1])}" r="2.5" fill="var(--wa)"/></svg></div><div class="mu" style="font-size:10px">Track of valid-fix positions (no map tiles).</div>`;
}

const nw_NW=()=>win('w:roll',nw_wh('Roll','roll')+`<div class="row" style="margin:0">${nw_bg(nw_nv('roll'),'°')}${nw_dial('roll',v=>v)}</div>`+nw_spark('roll'),{b:'col'})+win('w:pitch',nw_wh('Pitch','pitch')+`<div class="row" style="margin:0">${nw_bg(nw_nv('pitch'),'°')}${nw_dial('pitch',v=>-v)}</div>`+nw_spark('pitch'),{b:'col'})+win('w:gps',nw_gpsBody(),{b:'col'})+win('w:pres',nw_wh('Pressure','pressure')+nw_bg(nw_nv('pressure'),'hPa')+`<div class="mu">BMP280 temp ${nw_nv('bmpTemperature')} °C</div>`+nw_spark('pressure'),{b:'col'})+win('w:balt',nw_wh('BMP altitude','bmpAltitude')+nw_bg(nw_nv('bmpAltitude'),'m')+'<div class="mu">Barometric; depends on the firmware’s sea-level reference</div>'+nw_spark('bmpAltitude'),{b:'col'});

const nw_SX={};
function nw_simExtra(p){
  const x=sim.x,r=()=>Math.random()-.5,dt=cfg.interval/1000;
  if(sim.seq<=1||nw_SX.p==null)Object.assign(nw_SX,{ro:0,pi:0,p:1013.2,la:20,lo:78,al:120});
  nw_SX.ro=((nw_SX.ro*(F.sc==='spin'?1:.97)+x.gx*dt+540)%360)-180;
  nw_SX.pi=Math.max(-89,Math.min(89,nw_SX.pi*.97+x.gy*dt));
  nw_SX.p+=r()*.1+(1013.2-nw_SX.p)*.01;
  nw_SX.al+=r()*.6+(120-nw_SX.al)*.02;
  nw_SX.la+=r()*2e-5;
  nw_SX.lo+=r()*2e-5;
  Object.assign(p,{
    roll:+nw_SX.ro.toFixed(2),
    pitch:+nw_SX.pi.toFixed(2),
    latitude:+nw_SX.la.toFixed(6),
    longitude:+nw_SX.lo.toFixed(6),
    altitude:+nw_SX.al.toFixed(1),
    speed:+(Math.abs(r())*3).toFixed(1),
    satellites:8+Math.round(r()*2),
    gpsFix:1,
    bmpTemperature:+(x.t+.5).toFixed(2),
    pressure:+nw_SX.p.toFixed(2),
    bmpAltitude:+(44330*(1-Math.pow(nw_SX.p/1013.25,.1903))).toFixed(1)
  });
}

function liveRows(cs){
  const b=buf.slice(-20),out=[],mrow=(sq,st)=>`<tr class="ms"><td>${sq}</td><td>${st}</td><td></td>${cs.map(()=>'<td></td>').join('')}<td></td></tr>`;
  b.forEach((r,i)=>{
    const pv=b[i-1];
    if(pv){
      const a=pv.sequence_number+1,z=r.sequence_number-1,g=z-a+1;
      if(g>0){
        if(g<=8)for(let q=a;q<=z;q++)out.push(mrow(q,'MISSING'));
        else out.push(mrow(a+'–'+z,g+' MISSING'));
      }
    }
    out.push(`<tr><td>${r.sequence_number}</td><td>${r.timestamp.slice(11,23)}Z</td><td>${chip(r.source)}</td>${cs.map(p=>`<td${cfg.sensors[p.s]&&r[p.k]==null?' class="ms"':''}>${fmt(r[p.k])}</td>`).join('')}<td>${esc(r.status)}</td></tr>`);
  });
  return out.reverse().join('');
}

<pre>${esc(`// ESP32 DevKit V1 - ESP-NOW to Serial Bridge
#include <WiFi.h>
#include <esp_now.h>
#include <esp_wifi.h>

#define WIFI_CHANNEL 1
#define LED_PIN 2

struct __attribute__((packed)) SensorPacket {
  uint32_t packetNo;
  float temperature, humidity;
  float ax, ay, az, totalAcc;
  float gx, gy, gz;
  float roll, pitch;
  double latitude, longitude;
  float altitude, speed;
  uint32_t satellites;
  uint8_t gpsFix;
  float bmpTemperature, pressure, bmpAltitude;
};

SensorPacket rxData;

void onDataReceive(const uint8_t *mac, const uint8_t *data, int len) {
  if (len != sizeof(SensorPacket)) return;
  memcpy(&rxData, data, sizeof(SensorPacket));
  
  // Format as single-line JSON for Node.js
  Serial.print("{\\"packetNo\\":"); Serial.print(rxData.packetNo);
  Serial.print(",\\"temperature\\":"); Serial.print(rxData.temperature, 2);
  Serial.print(",\\"humidity\\":"); Serial.print(rxData.humidity, 2);
  Serial.print(",\\"ax\\":"); Serial.print(rxData.ax, 3);
  Serial.print(",\\"ay\\":"); Serial.print(rxData.ay, 3);
  Serial.print(",\\"az\\":"); Serial.print(rxData.az, 3);
  Serial.print(",\\"totalAcc\\":"); Serial.print(rxData.totalAcc, 3);
  Serial.print(",\\"gx\\":"); Serial.print(rxData.gx, 2);
  Serial.print(",\\"gy\\":"); Serial.print(rxData.gy, 2);
  Serial.print(",\\"gz\\":"); Serial.print(rxData.gz, 2);
  Serial.print(",\\"roll\\":"); Serial.print(rxData.roll, 2);
  Serial.print(",\\"pitch\\":"); Serial.print(rxData.pitch, 2);
  Serial.print(",\\"latitude\\":"); Serial.print(rxData.latitude, 6);
  Serial.print(",\\"longitude\\":"); Serial.print(rxData.longitude, 6);
  Serial.print(",\\"altitude\\":"); Serial.print(rxData.altitude, 2);
  Serial.print(",\\"speed\\":"); Serial.print(rxData.speed, 2);
  Serial.print(",\\"satellites\\":"); Serial.print(rxData.satellites);
  Serial.print(",\\"gpsFix\\":"); Serial.print(rxData.gpsFix);
  Serial.print(",\\"bmpTemperature\\":"); Serial.print(rxData.bmpTemperature, 2);
  Serial.print(",\\"pressure\\":"); Serial.print(rxData.pressure, 2);
  Serial.print(",\\"bmpAltitude\\":"); Serial.print(rxData.bmpAltitude, 2);
  Serial.println("}");
}

void setup() {
  pinMode(LED_PIN, OUTPUT);
  Serial.begin(115200);
  WiFi.mode(WIFI_STA);
  WiFi.disconnect();
  esp_wifi_set_channel(WIFI_CHANNEL, WIFI_SECOND_CHAN_NONE);

  esp_now_register_recv_cb(onDataReceive);
}

void loop() { delay(10); }`)}</pre>

<h3>2. Standalone Node.js Ground Station (server.js)</h3>
<div class="card mu">Run with <code>node server.js</code>. It listens to your computer's COM port, streams data over WebSockets, and hosts REST API endpoints (/api/telemetry and /api/history).</div>
<pre>${esc(`const http = require('http');
const express = require('express');
const { WebSocketServer, WebSocket } = require('ws');
const { SerialPort } = require('serialport');
const { ReadlineParser } = require('@serialport/parser-readline');

const app = express();
app.use(express.json());
app.use(express.static('public'));

const server = http.createServer(app);
const wss = new WebSocketServer({ server });
const history = [];

function broadcast(packet) {
  const msg = JSON.stringify(packet);
  wss.clients.forEach(c => c.readyState === WebSocket.OPEN && c.send(msg));
}

app.post('/api/telemetry', (req, res) => {
  const pkt = req.body;
  history.push(pkt);
  if (history.length > 1000) history.shift();
  broadcast(pkt);
  res.json({ success: true, packet: pkt });
});

app.get('/api/history', (req, res) => {
  const limit = parseInt(req.query.limit || '50', 10);
  res.json(history.slice(-limit));
});

// SerialPort listener
const port = new SerialPort({ path: 'COM3', baudRate: 115200 });
const parser = port.pipe(new ReadlineParser({ delimiter: '\\r\\n' }));
parser.on('data', line => {
  try {
    const raw = JSON.parse(line.trim());
    history.push(raw);
    broadcast(raw);
  } catch (err) {}
});

server.listen(3000, () => console.log('Ground Station server on port 3000'));`)}</pre>

  ack:id=>{const a=al.find(x=>x.id==id);if(a&&a.st==='active'){a.st='acknowledged';ev('INFO','Alert acknowledged: '+a.param,a.src)}},
  res:id=>{const a=al.find(x=>x.id==id);if(a){a.st='resolved';a.rt=iso();if(cur[a.key]===a)delete cur[a.key];ev('INFO','Alert resolved manually: '+a.param,a.src)}},
  exp:f=>{
    const r=hfilter(),cols=['source','received_at','satellite_id','sequence_number','timestamp','status',...P.map(p=>p.k)];
    const q=v=>{v=v??'';return/[",\n]/.test(v)?'"'+String(v).replace(/"/g,'""')+'"':v};
    const out=f==='json'?JSON.stringify({exported_at_utc:iso(),units:Object.fromEntries(P.map(p=>[p.k,p.u])),records:r},null,1):[cols.map(c=>PM[c]?`${c} (${PM[c].u})`:c).join(','),...r.map(x=>cols.map(c=>q(x[c])).join(','))].join('\n');
    EX={fmt:f,out,n:r.length};
    try{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([out],{type:'text/plain'}));
      a.download='orbitrex-export.'+f;
      a.click();
    }catch(e){EX.err=String(e)}
  },
  clr:()=>{
    if(CF!=='clr'){CF='clr';return}
    CF='';if(!db)return;
    try{db.transaction('packets','readwrite').objectStore('packets').clear().onsuccess=()=>{hist=[];render()}}catch(e){serr=String(e)}
  },
  save:()=>{
    SE=verr(draft);if(SE.length)return;
    cfg=clone(draft);persist();applyCfg();
    SM=cfgOk?'Settings saved.':'Applied, but could NOT be persisted.';
  },
  cancel:()=>{draft=clone(cfg);SE=[];SM=''},
  defaults:()=>{
    if(CF!=='def'){CF='def';return}
    CF='';cfg=clone(DEF);draft=clone(cfg);persist();applyCfg();
    SM='Defaults restored (history untouched).';
  },
  copyBridge:()=>{
    const code = $('#main pre')?.innerText || '';
    navigator.clipboard.writeText(code);
    copiedBridge=true;render();setTimeout(()=>{copiedBridge=false;render()},2000);
  },
  copyServer:()=>{
    fetch('server.js').then(r=>r.text()).then(t=>{
      navigator.clipboard.writeText(t);
      copiedServer=true;render();setTimeout(()=>{copiedServer=false;render()},2000);
    }).catch(()=>{navigator.clipboard.writeText('node server.js');});
  },
  copyPkg:()=>{
    navigator.clipboard.writeText('{\n  "name": "cubesat-groundstation",\n  "version": "1.0.0",\n  "main": "server.js"\n}');
    copiedPkg=true;render();setTimeout(()=>{copiedPkg=false;render()},2000);
  },
  pingBackend:()=>{
    fetch('api/status').then(r=>r.json()).then(s=>{
      alert(`Backend Online!\nClients: ${s.connectedClients}\nUptime: ${s.uptimeSeconds}s`);
    }).catch(e=>alert(`Backend not detected: ${e}`));
  }
};

function verr(d){
  const e=[],n=(v,lo,hi,l)=>{if(!(v>=lo&&v<=hi))e.push(`${l} must be a number from ${lo} to ${hi}`)};
  if(!String(d.sat).trim())e.push('Satellite ID is required');
  if(!String(d.mission).trim())e.push('Mission name is required');
  n(d.interval,100,60000,'Simulator interval');
  n(d.timeout,2,3600,'Telemetry timeout');
  n(d.retention,100,100000,'Retention');
  n(d.th.tw,-60,150,'Temperature warning');
  n(d.th.tc,-60,150,'Temperature critical');
  n(d.th.bw,0,6,'Battery warning');
  n(d.th.bc,0,6,'Battery critical');
  n(d.th.sw,-140,0,'Signal warning');
  for(const k in d.hyst)n(d.hyst[k],0,50,'Hysteresis '+k);
  if(d.th.tw>=d.th.tc)e.push('Temperature warning must be below critical');
  if(d.th.bw<=d.th.bc)e.push('Battery warning must be above critical');
  if(d.start&&isNaN(Date.parse(d.start+':00Z')))e.push('Mission start is invalid');
  if(d.mode==='hardware'&&d.ws&&!/^wss?:\/\//.test(d.ws))e.push('WebSocket URL must start with ws:// or wss://');
  return e;
}

/* ---- 3D ATTITUDE CUBOID DRIVEN BY GYRO & ORIENTATION ---- */
const AT={q:[1,0,0,0],d:[1,0,0,0],t:null,w:null,rx:0,src:'',bu:0,lb:[],W:0,H:0,s:1};
const CW=40,CH=40,CD=40;
const FC=[
  ['+Z',CW,CH,`translateZ(${CD/2}px)`,'#3b82f655'],
  ['−Z',CW,CH,`rotateY(180deg) translateZ(${CD/2}px)`,'#3b82f622'],
  ['+X',CD,CH,`rotateY(90deg) translateZ(${CW/2}px)`,'#ef444444'],
  ['−X',CD,CH,`rotateY(-90deg) translateZ(${CW/2}px)`,'#ef444422'],
  ['+Y',CW,CD,`rotateX(90deg) translateZ(${CH/2}px)`,'#22c55e44'],
  ['−Y',CW,CD,`rotateX(-90deg) translateZ(${CH/2}px)`,'#22c55e22']
];

const qm=(a,b)=>[
  a[0]*b[0]-a[1]*b[1]-a[2]*b[2]-a[3]*b[3],
  a[0]*b[1]+a[1]*b[0]+a[2]*b[3]-a[3]*b[2],
  a[0]*b[2]-a[1]*b[3]+a[2]*b[0]+a[3]*b[1],
  a[0]*b[3]+a[1]*b[2]-a[2]*b[1]+a[3]*b[0]
];
const qn=q=>{const n=Math.hypot(...q)||1;return q.map(v=>v/n)};
const TIP=42;
const AXC=[['X','var(--cr)','',[TIP,0,0]],['Y','var(--ok)','rotateZ(-90deg)',[0,-TIP,0]],['Z','var(--bl)','rotateY(-90deg)',[0,0,TIP]]];
const AXES=AXC.map(([n,c,t])=>['','rotateX(90deg)'].map(r=>`<div class="ax" style="background:${c};transform:${t} ${r}"></div>`).join('')).join('')+AXC.map(([n,c,,p])=>`<div class="al" data-p="${p}" style="color:${c}">${n}</div>`).join('');
const PT=[];
const RM=matchMedia('(prefers-reduced-motion: reduce)');
const pcol=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function attFx(pv,c){
  const q=AT.d;
  const iv=`matrix3d(${c[0]},${c[1]},${c[2]},0,${c[3]},${c[4]},${c[5]},0,${c[6]},${c[7]},${c[8]},0,0,0,0,1)`;
  AT.lb.forEach(({e,p})=>e.style.transform=`translate3d(${p[0]}px,${p[1]}px,${p[2]}px) ${iv} rotateY(35deg) rotateX(20deg) translate(-50%,-50%)`);
  const cv=$('#pc');
  if(!cv||!AT.W||!AT.H){AT.bu=0;return}
  const g=cv.getContext('2d');
  if(!g)return;
  const now=performance.now();
  const dt=Math.min(.05,(now-(AT.lt||now))/1000);
  const s=AT.s;
  AT.lt=now;

  const em=(n,col,sp)=>{
    for(let i=0;i<n&&PT.length<80;i++){
      const a=Math.random()*6.283,r=Math.random()*14*s,v=sp*s*(.5+Math.random()),l=.6+Math.random()*.5;
      PT.push({x:AT.W/2+Math.cos(a)*r,y:AT.H/2+Math.sin(a)*r,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l,m:l,c:col,r:(1+Math.random()*1.2)*Math.sqrt(s)});
    }
  };

  if(!RM.matches){
    const k=2*Math.acos(Math.min(1,Math.abs(pv[0]*q[0]+pv[1]*q[1]+pv[2]*q[2]+pv[3]*q[3])))*28.65;
    em(Math.min(4,Math.floor(k)+(Math.random()<k%1?1:0)),pcol('--cy'),28);
    if(AT.bu>0){const n=Math.min(AT.bu,8);AT.bu-=n;em(Math.round(n),pcol('--wa'),70)}
  }else AT.bu=0;

  g.clearRect(0,0,cv.width,cv.height);
  for(let i=PT.length-1;i>=0;i--){
    const t=PT[i];
    t.l-=dt;
    if(t.l<=0){PT.splice(i,1);continue}
    t.x+=t.vx*dt;t.y+=t.vy*dt;t.vx*=.96;t.vy*=.96;
    g.globalAlpha=t.l/t.m;
    g.fillStyle=t.c;
    g.beginPath();
    g.arc(t.x,t.y,t.r,0,6.283);
    g.fill();
  }
  g.globalAlpha=1;
}

function attIn(r){
  if(typeof r.roll==='number'&&typeof r.pitch==='number'){
    const rollRad=(r.roll*Math.PI)/360;
    const pitchRad=(r.pitch*Math.PI)/360;
    const cr=Math.cos(rollRad),sr=Math.sin(rollRad);
    const cp=Math.cos(pitchRad),sp=Math.sin(pitchRad);
    AT.q=qn([cr*cp,sr*cp,cr*sp,-sr*sp]);
  }
  const g=['gyroscope_x','gyroscope_y','gyroscope_z'].map(k=>r[k]);
  if(!cfg.sensors.imu_g||g.some(v=>v==null)){AT.t=null;return}
  const t=Date.parse(r.timestamp);
  if(AT.t!=null&&AT.src===r.source){
    const dt=(t-AT.t)/1000;
    if(dt>0&&dt<=2){
      const w=g.map(v=>v*Math.PI/180),m=Math.hypot(...w),th=m*dt;
      if(th>0){
        const s=Math.sin(th/2)/m;
        AT.q=qn(qm(AT.q,[Math.cos(th/2),w[0]*s,w[1]*s,w[2]*s]));
      }
    }
  }
  if(AT.w&&AT.src===r.source){
    const d=Math.hypot(g[0]-AT.w[0],g[1]-AT.w[1],g[2]-AT.w[2]);
    if(d>25)AT.bu=Math.min(40,AT.bu+d/2);
  }
  AT.t=t;AT.src=r.source;AT.w=g;AT.rx=Date.now();
  attTxt();
}

function attTxt(){
  const s=!cfg.sensors.imu_g?'NOT CONFIGURED':!AT.w?'NO DATA':Date.now()-AT.rx>cfg.timeout*1000?'STALE':'AVAILABLE';
  const e=$('#atS');
  if(!e)return;
  e.innerHTML=chip(AT.w?AT.src:srcName());
  const rEl=$('#atR');
  if(rEl){
    rEl.innerHTML=chip(s)+'<br>ω '+(AT.w&&s!=='NOT CONFIGURED'?AT.w.map(v=>v.toFixed(1)).join(' / '):'— / — / —')+' °/s';
  }
}

function attDraw(){
  const a=AT.d,b=AT.q,k=a[0]*b[0]+a[1]*b[1]+a[2]*b[2]+a[3]*b[3]<0?-1:1;
  AT.d=qn(a.map((v,i)=>v+(k*b[i]-v)*.2));
  const[w,x,y,z]=AT.d;
  const r=[
    1-2*(y*y+z*z),2*(x*y-w*z),2*(x*z+w*y),
    2*(x*y+w*z),1-2*(x*x+z*z),2*(y*z-w*x),
    2*(x*z-w*y),2*(y*z+w*x),1-2*(x*x+y*y)
  ];
  const c=[r[0],-r[1],r[2],-r[3],r[4],-r[5],r[6],-r[7],r[8]];
  const cb=$('#cb');
  if(cb){
    cb.style.transform=`matrix3d(${c[0]},${c[1]},${c[2]},0,${c[3]},${c[4]},${c[5]},0,${c[6]},${c[7]},${c[8]},0,0,0,0,1)`;
  }
  attFx(a,c);
  requestAnimationFrame(attDraw);
}

function attInit(){
  const attEl=$('#att');
  if(!attEl)return;
  attEl.innerHTML=`<div class="row" style="margin:0 0 2px;justify-content:space-between"><b>ORIENTATION</b><button data-act="attM" style="margin-left:auto" title="Maximize / restore">⤢</button><button data-act="attT" title="Collapse / expand">▾</button></div><div class="sc"><canvas id="pc"></canvas><div class="vw"><div class="cb" id="cb">${FC.map(([l,w,h,t,c])=>`<div class="fc" style="width:${w}px;height:${h}px;margin:${-h/2}px 0 0 ${-w/2}px;transform:${t};background:${c}"></div>`).join('')}${AXES}</div></div></div><div class="nt"><span id="atS"></span></div><div id="atR"></div><div class="nt" style="font-size:.85em"><b style="color:var(--cr)">X</b> right · <b style="color:var(--ok)">Y</b> up · <b style="color:var(--bl)">Z</b> toward you</div><div class="mu nt" style="font-size:9px">Gyro-integrated, relative to start pose; drifts over time.</div><button data-act="attR" class="nt" title="Use the current pose as the reference">Reset orientation</button>`;

  AT.lb=[...document.querySelectorAll('#att .al')].map(e=>({e,p:e.dataset.p.split(',')}));
  const sc=$('#att .sc'),cv=$('#pc'),vw=$('#att .vw');
  if(sc&&cv&&vw){
    new ResizeObserver(()=>{
      const w=sc.clientWidth,h=sc.clientHeight;
      AT.W=w;AT.H=h;
      if(!w||!h)return;
      AT.s=Math.max(.6,Math.min(w/170,h/112));
      cv.width=w;cv.height=h;
      vw.style.transform=`rotateX(-20deg) rotateY(-35deg) scale(${AT.s})`;
      sc.style.perspective=420*AT.s+'px';
    }).observe(sc);
  }
  attTxt();
  requestAnimationFrame(attDraw);
}

A.attT=()=>$('#att')?.classList.toggle('col');
A.attM=()=>{
  const e=$('#att');
  if(e){e.classList.remove('col');e.classList.toggle('max')}
};
A.attR=()=>{AT.q=[1,0,0,0];AT.d=[1,0,0,0]};
A.lyR=()=>{LAY={};saveLay();render()};

document.addEventListener('pointerdown',e=>{
  const h=e.target.closest&&e.target.closest('.rz');
  if(!h||e.button>0)return;
  const id=h.dataset.rz,w=h.closest('.win'),s=lay(id);
  DR={
    id,w,x:e.clientX,y:e.clientY,c:s[0],r:s[1],
    cw:(w.parentNode.clientWidth-GAP*(NC-1))/NC+GAP,
    rh:CELL+GAP,
    m:mn(id)
  };
  w.classList.add('rs');
  try{h.setPointerCapture(e.pointerId)}catch{}
  e.preventDefault();
});

document.addEventListener('pointermove',e=>{
  if(!DR)return;
  const d=DR,c=Math.max(d.m[0],Math.min(NC,Math.round(d.c+(e.clientX-d.x)/d.cw))),r=Math.max(d.m[1],Math.min(40,Math.round(d.r+(e.clientY-d.y)/d.rh))),o=LAY[d.id];
  if(!o||o[0]!==c||o[1]!==r){
    LAY[d.id]=[c,r];
    d.w.style.cssText=spn(d.id,c,r);
  }
});

const rzEnd=()=>{if(!DR)return;DR.w.classList.remove('rs');DR=null;saveLay();setTimeout(render,0)};
document.addEventListener('pointerup',rzEnd);
document.addEventListener('pointercancel',rzEnd);
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('.rz')){e.stopPropagation();e.preventDefault()}},true);

let rzT;
addEventListener('resize',()=>{
  clearTimeout(rzT);
  rzT=setTimeout(()=>{if(!DR&&view==='dash')render()},120);
});

document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('[data-act]');
  if(!b||b.disabled)return;
  const f=A[b.dataset.act];
  if(f){f(b.dataset.v);if(b.dataset.act!=='nav')render()}
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape')$('#att')?.classList.remove('max');
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.act&&e.target.tagName==='DIV')e.target.click();
});

document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset;
  if(d.l){
    const a=F[d.l],i=a.indexOf(d.v);
    i<0?a.push(d.v):a.splice(i,1);
  }else if(d.f){
    F[d.f]=t.value;
    if(/^h/.test(d.f))F.hpg=0;
  }else if(d.s){
    sp(draft,d.s,t.type==='checkbox'?t.checked:t.type==='number'?(t.value===''?NaN:+t.value):t.value);
    return;
  }else if(d.m){
    cfg[d.m]=t.value;
    persist();
    paintTop();
    return;
  }else return;
  render();
});

// Periodic heartbeat
setInterval(()=>{
  if(lastRecv&&Date.now()-lastRecv>cfg.timeout*1000){
    raise('comm','WARNING','Communication',null,cfg.timeout+' s','No valid telemetry for more than '+cfg.timeout+' s',srcName(),1);
  }else if(cur.comm&&lastRecv){
    clearA('comm');
  }
  attTxt();
  if(['dash','live','plots','sensors','alerts'].includes(view)&&!DR&&!/SELECT|INPUT|TEXTAREA/.test(document.activeElement?.tagName||'')){
    render();
  }else{
    paintTop();
  }
},1000);

// Initialize application
attInit();
openDB().then(()=>{
  applyCfg();
  if(cfg.mode==='sim') simGo();
  render();

  // If connected via HTTP/S, preload history from backend
  if(location.protocol.startsWith('http')){
    fetch('api/history?limit=50')
      .then(r=>r.json())
      .then(res=>{
        const pts=Array.isArray(res)?res:(res&&res.data);
        if(Array.isArray(pts)&&pts.length>0){
          pts.forEach(p=>ingest(p,'HARDWARE'));
          render();
        }
      })
      .catch(()=>{});
  }
});

document.documentElement.dataset.theme=cfg.theme;
render();
</script></body></html>
