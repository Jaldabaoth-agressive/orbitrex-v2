<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ORBITREX Mission Control</title>
  <meta name="description" content="CubeSat real-time telemetry ground station and mission control console." />
  <meta property="og:title" content="ORBITREX Mission Control" />
  <meta property="og:description" content="CubeSat real-time telemetry ground station and mission control console." />
  <meta property="og:type" content="website" />
  <style>
  :root{--bg:#04080f;--p:#0a1424;--p2:#0f1f38;--bd:#1b3050;--tx:#dbe7f6;--mu:#93a9c6;--cy:#22d3ee;--bl:#60a5fa;--ok:#22c55e;--wa:#f59e0b;--cr:#f87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  :root[data-theme=light]{--bg:#eef3fa;--p:#fff;--p2:#e6eef9;--bd:#b8c9e0;--tx:#0d1b2e;--mu:#44607f;--cy:#0e7490;--bl:#1d4ed8;--ok:#15803d;--wa:#b45309;--cr:#b91c1c}
  *{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;display:flex;overflow:hidden}
  aside{width:210px;background:var(--p);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:8px;gap:2px;flex:none}
  .lg{display:flex;gap:8px;align-items:center;padding:6px;margin-bottom:6px}.lg b{color:var(--cy);letter-spacing:.08em}.lg small{display:block;color:var(--mu);font-size:10px}
  aside button{all:unset;cursor:pointer;padding:8px;border-radius:6px;color:var(--mu);display:flex;gap:8px}aside button:hover,aside button:focus-visible{background:var(--p2);color:var(--tx)}aside button.on{background:var(--p2);color:var(--cy);box-shadow:inset 2px 0 var(--cy)}
  #mn{flex:1;min-width:0;display:flex;flex-direction:column}#top{display:flex;flex-wrap:wrap;gap:6px 18px;padding:8px 14px;background:var(--p);border-bottom:1px solid var(--bd);color:var(--mu);align-items:center}#top b{color:var(--tx)}
  #bn{padding:4px 14px;font-size:12px}main{flex:1;overflow:auto;padding:14px}h2{margin:0 0 8px;color:var(--cy)}h3{margin:16px 0 6px}
  .card{background:var(--p);border:1px solid var(--bd);border-radius:8px;padding:10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:10px 0}.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:10px;margin:10px 0}
  .card[data-act]{cursor:pointer}.card[data-act]:hover{border-color:var(--cy)}.row{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap}
  button{background:var(--p2);color:var(--tx);border:1px solid var(--bd);border-radius:5px;padding:4px 10px;cursor:pointer;font:inherit}button:hover{border-color:var(--cy)}button:disabled{opacity:.4;cursor:default}:focus-visible{outline:2px solid var(--cy)}
  .ch{padding:1px 7px;border-radius:10px;font-size:11px;border:1px solid currentColor;white-space:nowrap;color:var(--mu)}.ok{color:var(--ok)}.wa{color:var(--wa)}.cr{color:var(--cr)}.bl{color:var(--bl)}.mu{color:var(--mu)}.big{font-size:22px;color:var(--cy)}.big small{font-size:12px;color:var(--mu)}
  table{border-collapse:collapse;width:100%}th,td{padding:4px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu)}.x{overflow-x:auto}pre{background:var(--p);padding:8px;overflow:auto;border:1px solid var(--bd);max-height:260px}
  input,select,textarea{background:var(--p2);color:var(--tx);border:1px solid var(--bd);border-radius:4px;padding:4px 6px;font:inherit}textarea{width:100%}.f{display:grid;grid-template-columns:230px 200px 1fr;gap:8px;align-items:center;margin:4px 0}.f em{color:var(--mu);font-size:11px}
  svg text{fill:var(--mu);font-size:9px}.em{color:var(--mu);padding:14px;text-align:center}.bar{height:8px;background:var(--p2);border-radius:4px}.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}.arch{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  #att{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:190px;background:var(--p);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;z-index:5;font-size:11px}#att .sc{position:relative;height:112px;perspective:420px;display:flex;align-items:center;justify-content:center}#att .vw{width:0;height:0;transform-style:preserve-3d;transform:rotateX(-20deg) rotateY(-35deg)}#att .cb{width:0;height:0;transform-style:preserve-3d}#att .fc{position:absolute;left:50%;top:50%;border:1px solid var(--cy);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--tx);backface-visibility:hidden}#att.col .sc,#att.col #atR,#att.col .nt{display:none}#att #pc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#att .ax{position:absolute;left:0;top:-1px;width:34px;height:2px;transform-origin:0 50%}#att .al{position:absolute;left:0;top:0;font-size:10px;font-weight:700;white-space:nowrap}#att.max{top:calc(24px + env(safe-area-inset-top,0px));left:24px;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:auto;z-index:30;display:flex;flex-direction:column;font-size:13px;box-shadow:0 8px 40px #000a}#att.max .sc{flex:1;height:auto;min-height:0}
  /* resizable dashboard windows */
  .wg{display:grid;gap:8px;grid-auto-rows:30px;grid-auto-flow:dense;margin:0 0 10px}
  .win{position:relative;min-width:0;min-height:0;padding:0;overflow:hidden}
  .win.rs{border-color:var(--cy);user-select:none}
  .wb{position:absolute;inset:0;overflow:auto;padding:10px}.wb.col{display:flex;flex-direction:column}.wb.a{display:flex;flex-direction:column;padding:6px 8px}.wb .x{overflow:visible}
  .sp{position:relative;flex:1;min-height:18px;margin-top:4px}.sp svg{position:absolute;inset:0;width:100%;height:100%}
  tr.ms td,td.ms{background:rgba(248,113,113,.2)}tr.ms td{color:var(--cr)}.ml{display:inline-block;width:12px;height:12px;vertical-align:-2px;margin-right:4px;background:rgba(248,113,113,.35);border:1px solid var(--cr);border-radius:2px}
  .rz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;z-index:3;opacity:.5;border-bottom-right-radius:8px;background:linear-gradient(135deg,transparent 45%,var(--mu) 45%,var(--mu) 55%,transparent 55%,transparent 68%,var(--mu) 68%,var(--mu) 78%,transparent 78%)}.rz:hover,.win.rs .rz{opacity:1}
  #att.dock{position:static;width:auto;height:auto;border:0;border-radius:0;background:none;padding:0;z-index:auto;font-size:12px;display:flex;flex-direction:column;flex:1 0 auto;min-height:0}#att.dock .sc{flex:1;height:auto;min-height:80px}#att.dock [data-act=attT]{display:none}
  #att.dock.max{position:fixed;height:auto;flex:none;background:var(--p);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;z-index:30;font-size:13px}
  @media(max-width:900px){aside{width:52px}.lt,.lg div{display:none}.f{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <aside id="nav"></aside>
  <div id="mn">
    <header id="top"></header>
    <div id="bn"></div>
    <main id="main"></main>
  </div>
  <div id="att"></div>

  <script type="module" src="/src/orbitrex-client.ts"></script>
</body>
</html>
